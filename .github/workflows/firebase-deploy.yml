name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'artiva/**'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        working-directory: functions
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: artiva
        run: npm ci

      - name: Build Frontend
        working-directory: artiva
        run: npm run build

      - name: Build TypeScript
        working-directory: functions
        run: npm run build

      # Uncomment if you have a test script configured
      # - name: Run Tests
      #   working-directory: functions
      #   run: npm test

      - name: Deploy to Firebase
        working-directory: functions
        run: npx firebase-tools deploy --only functions,hosting,firestore,auth --project artiva-f24a8 --token ${{ secrets.FIREBASE_TOKEN }}

name: Firebase backend

on:
  push:
    branches: [main]
    paths:
      - functions/**
      - firebase.json
      - firestore.indexes.json
      - firestore.rules
      - storage.rules
      - .firebaserc
      - .github/workflows/firebase-deploy.yml
  pull_request:
    branches: [main]
    paths:
      - functions/**
      - firebase.json
      - firestore.indexes.json
      - firestore.rules
      - storage.rules
      - .firebaserc
      - .github/workflows/firebase-deploy.yml

permissions:
  contents: read

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Type-check, build, and run unit tests
        working-directory: functions
        run: npm run check

      - name: Test Firestore rules in the emulator
        working-directory: functions
        run: npm run test:rules

  deploy:
    name: Deploy production backend
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy functions, rules, and indexes
        run: >-
          ./functions/node_modules/.bin/firebase deploy
          --only functions,firestore:rules,firestore:indexes,storage
          --project "${{ vars.GCP_PROJECT_ID }}"
          --non-interactive
